name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdtools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$HOME/android-sdk/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Unit tests and debug APK
        run: ./gradlew test assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fireplan-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
